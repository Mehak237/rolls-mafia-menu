<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Rolls Mafia - Menu Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* FLOATING TOP ACTION BAR */
    .top-bar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid rgba(245, 179, 36, 0.3);
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      color: #f5b324;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #20222a;
      color: #fff;
      border: 1px solid #3d4150;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-call {
      background: #e63946;
      border-color: #e63946;
    }

    /* FULL MENU IMAGE CONTAINER */
    .menu-wrapper {
      width: 100%;
      max-width: 800px;
      padding: 8px 4px 60px;
      display: flex;
      justify-content: center;
    }

    .menu-card-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      user-select: none;
      -webkit-user-select: none;
    }

    .hint-text {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      padding: 8px;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="brand">
      <span>👑</span> ROLLS MAFIA MENU
    </div>
    <div class="actions">
      <a href="menu.jpg" download="Rolls_Mafia_Menu.jpg" class="btn">
        ⬇️ Save
      </a>
      <a href="tel:+919876543210" class="btn btn-call">
        📞 Call
      </a>
    </div>
  </header>

  <div class="hint-text">
    💡 Double tap ya pinch karke zoom karein
  </div>

  <!-- EXACT MENU CARD IMAGE -->
  <main class="menu-wrapper">
    <img src="menu.jpg" alt="Rolls Mafia Menu Card" class="menu-card-img" id="menuImg" />
  </main>

</body>
</html>
